spring:
  application:
    name: agent
  ai:
    deepseek:
      base-url: ${OPENAI_BASE_URL}
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL}



elasticsearch:
  url: ${ELASTIC_URL:https://localhost:9200}
  userName: ${ELASTIC_USER:}
  password: ${ELASTIC_PASSWORD:}
  caCert: ${CA_CERTS:/path/to/http_ca.crt}
  index: ${ELASTIC_INDEX}

milvus:
  uri: ${MILVUS_URI}
  token: ${MILVUS_TOKEN}
  dbName: ${MILVUS_DB}
  collection: ${MILVUS_COLLECTION}
  dim: ${MILVUS_DIM}

embedding:
  uri: ${EMBEDDING_BASE_URL}
  apiKey: ${SILICONFLOW_API_KEY}
  model: ${EMBEDDING_MODEL}

# Agent 多步 function-calling 编排参数
agent:
  # 单条回答允许的工具调用轮数上限（图层里的硬约束，控制"结果相互依赖"多步循环的停止条件）
  maxIterations: ${AGENT_MAX_ITERATIONS:5}

